# Scala Steward keeps the sbt build's dependencies, plugins, sbt itself and
# the Scala versions up to date. GitHub Actions are handled by Dependabot
# (.github/dependabot.yml).
#
# Options: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Open update PRs at most once a week.
pullRequests.frequency = "7 days"

updates.pin = [
  # Stay on the Scala 3.3 LTS line. A Scala 3 compiler can't read TASTy
  # produced by a newer minor version, so publishing with anything newer
  # would make dispatch unusable from projects still on 3.3. Moving to a
  # newer LTS is a deliberate decision, not a routine bump.
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },

  # Scala 3.8+ ships its standard library as scala-library 3.x. Keep the
  # 2.13 cross-build on the 2.13 line.
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.13." }
]
