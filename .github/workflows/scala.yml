name: Dispatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
        scala: ["2.13.18", "3.3.9", "3.9.0"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1
    - name: Run tests
      run: sbt ++${{ matrix.scala }} test
