name: Dispatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
        scala: ["2.13.18", "3.3.9", "3.9.0"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt ++${{ matrix.scala }} test
