name: Dispatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
        scala: ["2.13.18", "3.3.9", "3.9.0"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1
    - name: Run tests
      run: sbt ++${{ matrix.scala }} test
